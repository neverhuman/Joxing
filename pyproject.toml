[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joxing"
version = "0.0.10"
description = "Auditable muscle-driven boxing research on MS-Human-700"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mujoco==3.8.0", "numpy>=2.0,<3", "gymnasium>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
viz = ["matplotlib>=3.9", "imageio>=2.36", "imageio-ffmpeg>=0.6"]
gpu = [
    "mujoco-warp==3.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "warp-lang==1.12.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
motor = [
    "stable-baselines3>=2.7,<3",
    "torch>=2.4,<3",
]

[project.scripts]
joxing = "joxing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

